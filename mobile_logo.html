<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Anganwadi Smart</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width: 100%;
  height: 100%;
  background: #020C1B;
  overflow: hidden;
}
.screen {
  width: 100vw;
  height: 100vh;
  background: radial-gradient(ellipse at center, #051428 0%, #020C1B 70%);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

/* Subtle grid */
.screen::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,107,43,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,107,43,0.03) 1px, transparent 1px);
  background-size: 30px 30px;
}

/* Big glow behind logo */
.glow-bg {
  position: absolute;
  width: 70vw; height: 70vw;
  background: radial-gradient(circle, rgba(255,107,43,0.12) 0%, transparent 65%);
  border-radius: 50%;
  z-index: 0;
}

/* Logo */
.logo {
  position: relative;
  z-index: 2;
  width: 80vw;
  max-width: 360px;
  border-radius: 24px;
  overflow: hidden;
  box-shadow:
    0 0 60px rgba(255,107,43,0.6),
    0 0 120px rgba(255,107,43,0.25),
    0 0 200px rgba(255,107,43,0.1);
  border: 1px solid rgba(255,107,43,0.25);
  animation: float 3s ease-in-out infinite;
}
@keyframes float {
  0%,100% {
    transform: translateY(0px);
    box-shadow: 0 0 60px rgba(255,107,43,0.6), 0 0 120px rgba(255,107,43,0.25);
  }
  50% {
    transform: translateY(-16px);
    box-shadow: 0 0 80px rgba(255,107,43,0.8), 0 0 160px rgba(255,107,43,0.4);
  }
}
.logo img {
  width: 100%;
  display: block;
}

/* Bottom home indicator */
.indicator {
  position: absolute;
  bottom: 12px;
  width: 100px; height: 4px;
  background: rgba(255,255,255,0.2);
  border-radius: 3px;
  z-index: 10;
}
</style>
</head>
